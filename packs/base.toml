# teLLeM base rule pack (public, MIT). Seeds: Wikipedia "Signs of AI writing",
# awesome-slop, antislop-sampler, slop-gate, and the gainful deAi pass.
# Owner-specific rules (roles to jobs, semicolon ban) live in private packs.
#
# SCOPE: this pack is domain-agnostic. A rule belongs here when the tell shows
# up in generated prose generally, and a rationale must justify it that way. If
# the only reason a rule exists is one field (job applications, academic
# abstracts, marketing email), it belongs in a pack for that field, not here.
# Rationales are published output, so a resume-shaped rationale ships a
# resume-shaped tool.

[meta]
name = "base"
version = "0.1.0"

[bands]
seasoned = 2.0
heavy = 6.0

# ---------- T rules: lexical tells ----------

[[rules]]
id = "T001"
name = "em-dash"
kind = "regex"
pattern = "—"
weight = 1.0
rationale = "em-dash density is the top measurable tell, humans reach for commas"

[[rules]]
id = "T002"
name = "spaced-en-dash"
kind = "regex"
pattern = " – "
weight = 1.0
rationale = "spaced en-dash as a clause break is machine punctuation"

[[rules]]
id = "T003"
name = "curly-double-quotes"
kind = "regex"
pattern = "[“”]"
weight = 0.2
replace = '"'
rationale = "curly double quotes in plain text signal generated or pasted prose"

[[rules]]
id = "T004"
name = "curly-single-quotes"
kind = "regex"
pattern = "[‘’]"
weight = 0.1
replace = "'"
rationale = "curly apostrophes in plain text signal generated or pasted prose"

[[rules]]
id = "T005"
name = "not-x-but-y"
kind = "regex"
pattern = '(?i)\bnot (?:just|only|merely) \w+, but\b'
weight = 0.6
rationale = "the not X but Y contrast frame is a strong rhetorical tell"

[[rules]]
id = "T006"
name = "semicolon-density"
kind = "regex"
pattern = ";"
weight = 0.3
rationale = "semicolons are rare in casual human prose and dense in generated text"

[[rules]]
id = "T010"
name = "architected"
kind = "word"
weight = 1.0
rationale = "architect as a verb is inflation for built"
[rules.swaps]
architected = "built"
architecting = "building"

[[rules]]
id = "T011"
name = "leverage"
kind = "word"
weight = 1.0
rationale = "leverage as a verb for use is top-tier slop vocabulary"
[rules.swaps]
leverage = "use"
leverages = "uses"
leveraged = "used"
leveraging = "using"

[[rules]]
id = "T012"
name = "utilize"
kind = "word"
weight = 1.0
rationale = "utilize is use wearing a lab coat"
[rules.swaps]
utilize = "use"
utilizes = "uses"
utilized = "used"
utilizing = "using"
utilise = "use"
utilises = "uses"
utilised = "used"
utilising = "using"

[[rules]]
id = "T013"
name = "delve"
kind = "word"
weight = 1.2
rationale = "delve rose 10x in abstracts post ChatGPT (Science Advances, 15M abstracts)"
[rules.swaps]
delve = "look"
delves = "looks"
delved = "looked"
delving = "looking"

[[rules]]
id = "T014"
name = "showcase"
kind = "word"
weight = 1.0
rationale = "showcase as a verb is promotional register for show"
[rules.swaps]
showcase = "show"
showcases = "shows"
showcased = "showed"
showcasing = "showing"

[[rules]]
id = "T015"
name = "underscore"
kind = "word"
weight = 1.0
rationale = "underscores as emphasizes is academic slop"
[rules.swaps]
underscore = "highlight"
underscores = "highlights"
underscored = "highlighted"
underscoring = "highlighting"

[[rules]]
id = "T016"
name = "harness-verb"
kind = "word"
weight = 1.0
rationale = "harness as a verb for use is slop, the noun (test harness) is legitimate"
unless_preceded_by = [
  "the", "a", "an", "this", "that", "these", "those",
  "its", "our", "their", "my", "your",
  "test", "tests", "eval", "evals", "evaluation", "wiring", "cable", "safety",
]
[rules.swaps]
harness = "use"
harnesses = "uses"
harnessed = "used"
harnessing = "using"

[[rules]]
id = "T017"
name = "bolster"
kind = "word"
weight = 0.8
rationale = "bolster is press-release vocabulary"
[rules.swaps]
bolster = "strengthen"
bolsters = "strengthens"
bolstered = "strengthened"
bolstering = "strengthening"

[[rules]]
id = "T018"
name = "streamline"
kind = "word"
weight = 0.8
rationale = "streamline is corporate filler for simplify"
[rules.swaps]
streamline = "simplify"
streamlines = "simplifies"
streamlined = "simplified"
streamlining = "simplifying"

[[rules]]
id = "T019"
name = "meticulous"
kind = "word"
weight = 1.0
rationale = "meticulous(ly) is a top over-represented model adverb family"
[rules.swaps]
meticulous = "careful"
meticulously = "carefully"

[[rules]]
id = "T020"
name = "boast"
kind = "word"
weight = 0.8
rationale = "products that boast features are machine-written products"
[rules.swaps]
boast = "have"
boasts = "has"

[[rules]]
id = "T021"
name = "pivotal"
kind = "word"
weight = 1.0
rationale = "pivotal is a top over-represented model adjective"
[rules.swaps]
pivotal = "key"

[[rules]]
id = "T022"
name = "intricate"
kind = "word"
weight = 0.8
rationale = "intricate is over-represented in model prose"
[rules.swaps]
intricate = "complex"
intricacies = "details"

[[rules]]
id = "T023"
name = "realm"
kind = "word"
weight = 1.0
rationale = "realm outside fantasy fiction is model dialect"
[rules.swaps]
realm = "area"
realms = "areas"

[[rules]]
id = "T024"
name = "testament"
kind = "word"
weight = 1.0
rationale = "a testament to is a canonical model formula"
[rules.swaps]
testament = "sign"
testaments = "signs"

[[rules]]
id = "T025"
name = "myriad"
kind = "word"
weight = 0.8
rationale = "myriad is over-represented in model prose"
[rules.swaps]
myriad = "many"

[[rules]]
id = "T026"
name = "seamless"
kind = "word"
weight = 0.8
rationale = "seamless(ly) is marketing slop beloved by models"
[rules.swaps]
seamless = "smooth"
seamlessly = "smoothly"

[[rules]]
id = "T027"
name = "garner"
kind = "word"
weight = 0.8
rationale = "garner is over-represented in model prose"
[rules.swaps]
garner = "gain"
garners = "gains"
garnered = "gained"
garnering = "gaining"

[[rules]]
id = "T028"
name = "endeavor"
kind = "word"
weight = 0.8
rationale = "endeavor as a noun for effort is model formality"
[rules.swaps]
endeavor = "effort"
endeavors = "efforts"
endeavour = "effort"
endeavours = "efforts"

[[rules]]
id = "T029"
name = "noteworthy"
kind = "word"
weight = 0.6
rationale = "noteworthy is over-represented in model prose"
[rules.swaps]
noteworthy = "notable"

[[rules]]
id = "T030"
name = "paramount"
kind = "word"
weight = 0.8
rationale = "paramount is over-represented in model prose"
[rules.swaps]
paramount = "essential"

# report-only words (no safe universal swap)

[[rules]]
id = "T033"
name = "tapestry"
kind = "word"
weight = 1.2
patterns = ["tapestry", "tapestries"]
