# ---------- P rules: phrase tells ----------

[[rules]]
id = "P001"
name = "shed-light-on"
kind = "phrase"
patterns = ["shed light on", "sheds light on", "shedding light on"]
replace = "shows"
weight = 1.0
rationale = "shed light on is a canonical model cliche"

[[rules]]
id = "P002"
name = "navigate-the-landscape"
kind = "regex"
pattern = '(?i)\bnavigat(?:e|es|ing) the (?:complex )?landscape of\b'
replace = "work through"
weight = 1.2
rationale = "navigating landscapes is peak model metaphor"

[[rules]]
id = "P003"
name = "fast-paced-world"
kind = "regex"
pattern = "(?i)\\bin today['’]?s fast[- ]paced (?:world|environment|market)\\b,?\\s*"
replace = ""
weight = 1.5
rationale = "in today's fast-paced world is throat-clearing no human types"

[[rules]]
id = "P004"
name = "worth-noting"
kind = "regex"
pattern = "(?i)\\bit['’]?s worth noting that\\b\\s*"
replace = ""
weight = 1.0
rationale = "it's worth noting that is filler, the sentence works without it"

[[rules]]
id = "P005"
name = "important-to-note"
kind = "regex"
pattern = '(?i)\bit is important to note that\b\s*'
replace = ""
weight = 1.0
rationale = "it is important to note that is filler, delete and nothing is lost"

[[rules]]
id = "P006"
name = "that-being-said"
kind = "regex"
pattern = '(?i)\bthat being said,?\s*'
replace = ""
weight = 0.8
rationale = "that being said is a model transition tic"

[[rules]]
id = "P007"
name = "at-its-core"
kind = "regex"
pattern = '(?i)\bat its core,?\s*'
weight = 0.8
replace = ""
rationale = "at its core is a model framing tic"

[[rules]]
id = "P008"
name = "needless-to-say"
kind = "regex"
pattern = '(?i)\bneedless to say,?\s*'
replace = ""
weight = 0.8
rationale = "if it is needless to say, the model said it anyway"

[[rules]]
id = "P009"
name = "without-further-ado"
kind = "regex"
pattern = '(?i)\bwithout further ado,?\s*'
replace = ""
weight = 1.0
rationale = "without further ado is listicle-generator glue"

[[rules]]
id = "P010"
name = "goes-without-saying"
kind = "regex"
pattern = '(?i)\bit goes without saying that\b\s*'
replace = ""
weight = 0.8
rationale = "it goes without saying, yet the model says it"

# report-only phrases

[[rules]]
id = "P020"
name = "deep-dive"
kind = "phrase"
patterns = ["deep dive", "deep dives", "dive deeper into", "dive into"]
weight = 0.5
rationale = "diving into topics is a model motion metaphor"

[[rules]]
id = "P021"
name = "in-conclusion"
kind = "phrase"
patterns = ["in conclusion", "in summary", "to summarize", "to sum up"]
weight = 0.5
rationale = "explicit summary markers are essay-bot structure"

[[rules]]
id = "P022"
name = "end-of-the-day"
kind = "phrase"
patterns = ["at the end of the day"]
weight = 0.5
rationale = "at the end of the day is filler models over-produce"

[[rules]]
id = "P023"
name = "first-and-foremost"
kind = "phrase"
patterns = ["first and foremost"]
weight = 0.5
rationale = "first and foremost is over-represented model glue"

[[rules]]
id = "P024"
name = "look-no-further"
kind = "phrase"
patterns = ["look no further"]
weight = 1.0
rationale = "look no further is ad-copy slop"

[[rules]]
id = "P025"
name = "game-changer"
kind = "phrase"
patterns = ["game changer", "game-changer", "game-changing"]
weight = 0.8
rationale = "game changer is hype slop models reproduce"

[[rules]]
id = "P026"
name = "cutting-edge"
kind = "phrase"
patterns = ["cutting-edge", "cutting edge"]
weight = 0.6
rationale = "cutting-edge is default model praise for any technology"

[[rules]]
id = "P027"
name = "unlock-the-power"
kind = "phrase"
patterns = ["unlock the power", "unlock the potential", "harness the power"]
weight = 1.0
rationale = "unlocking power and potential is marketing slop"

[[rules]]
id = "P028"
name = "possibilities-endless"
kind = "phrase"
patterns = ["the possibilities are endless"]
weight = 1.0
rationale = "the possibilities are endless is canonical closer slop"

[[rules]]
id = "P029"
name = "revolutionize"
kind = "phrase"
patterns = ["revolutionize the way", "revolutionise the way"]
weight = 0.8
rationale = "revolutionizing the way we X is hype slop"

[[rules]]
id = "P030"
name = "in-essence"
kind = "phrase"
patterns = ["in essence"]
weight = 0.4
rationale = "in essence is a model summarizing tic"

[[rules]]
id = "P031"
name = "when-it-comes-to"
kind = "phrase"
patterns = ["when it comes to"]
weight = 0.3
rationale = "when it comes to is low-signal filler models overuse"

[[rules]]
id = "P032"
name = "email-finds-you-well"
kind = "phrase"
patterns = ["i hope this email finds you well", "hope this message finds you well"]
weight = 1.5
rationale = "the canonical generated-email opener"

[[rules]]
id = "P033"
name = "as-an-ai"
kind = "phrase"
patterns = ["as an ai language model", "as an ai assistant"]
weight = 5.0
rationale = "the model told you itself"

[[rules]]
id = "P034"
name = "stands-serves-as"
kind = "phrase"
patterns = ["stands as a", "serves as a"]
weight = 0.5
rationale = "stands as and serves as are model copula inflation"

[[rules]]
id = "P035"
name = "ever-evolving"
kind = "phrase"
patterns = ["ever-evolving", "ever evolving"]
weight = 0.8
rationale = "ever-evolving is canonical model filler"

[[rules]]
id = "P036"
name = "end-to-end-filler"
kind = "phrase"
patterns = ["end to end", "end-to-end"]
weight = 0.3
rationale = "end to end is filler in summaries, real in systems talk, judge in context"

[[rules]]
id = "P037"
name = "wealth-of"
kind = "phrase"
patterns = ["a wealth of"]
weight = 0.6
rationale = "a wealth of is over-represented model quantity framing"

[[rules]]
id = "P038"
name = "treasure-trove"
kind = "phrase"
patterns = ["treasure trove"]
weight = 0.8
rationale = "treasure trove is canonical model metaphor"

[[rules]]
id = "P039"
name = "double-edged-sword"
kind = "phrase"
patterns = ["double-edged sword", "double edged sword"]
weight = 0.6
rationale = "double-edged sword is a model balance cliche"

[[rules]]
id = "P040"
name = "digital-age"
kind = "phrase"
patterns = ["the digital age", "in the digital era"]
weight = 0.6
rationale = "the digital age framing is essay-bot scene setting"

[[rules]]
id = "P041"
name = "defensive-qualifier"
kind = "regex"
pattern = '(?i)\b(?:paid|actual|real|genuine|proven|legitimate)\s+(?:experience|work|results?|skills?)\b'
weight = 0.4
rationale = "qualifiers that defend a claim weaken it, state the claim plainly"

[[rules]]
id = "P042"
name = "a-myriad-of"
kind = "phrase"
patterns = ["a myriad of", "myriads of"]
replace = "many"
weight = 0.8
rationale = "a myriad of is the model's plural, and the bare swap to many breaks the article"

[[rules]]
id = "P043"
name = "a-testament-to"
kind = "phrase"
patterns = ["a testament to", "is testament to"]
replace = "a sign of"
weight = 1.0
rationale = "a testament to is a canonical model formula, and sign takes of, not to"

# ---------- Added 2026-07-31: performed enthusiasm and credential cliches.
# Both classes turn up wherever prose is trying to impress a reader, which is
# most generated writing, and neither was covered.

[[rules]]
id = "T053"
name = "passionate"
kind = "word"
patterns = ["passionate", "passionately"]
weight = 0.9
rationale = "passionate about is claimed enthusiasm standing in for a reason. Flag only: deleting the adjective leaves broken grammar, the writer picks the replacement"

[[rules]]
id = "T054"
name = "thrilled"
kind = "word"
weight = 0.8
rationale = "thrilled and excited to announce are performed enthusiasm, not writing"
[rules.swaps]
thrilled = "glad"

[[rules]]
id = "T055"
name = "robust"
kind = "word"
patterns = ["robust"]
weight = 0.7
rationale = "robust is a filler adjective, name the property instead (fast, tested, fault-tolerant). Flag only: robust statistics is a term of art, an auto-swap changes meaning"

[[rules]]
id = "T056"
name = "dynamic-adjective"
kind = "regex"
pattern = '(?i)\bdynamic (?:team|environment|role|individual|professional|company)\b'
weight = 0.7
rationale = "a dynamic team says nothing, it is filler around the noun"

[[rules]]
id = "P044"
name = "proven-track-record"
kind = "phrase"
patterns = ["proven track record", "a track record of success", "demonstrated track record"]
weight = 1.0
rationale = "proven track record asserts nothing checkable, it is credibility by assertion"

[[rules]]
id = "P045"
name = "hit-the-ground-running"
kind = "phrase"
patterns = ["hit the ground running", "ready to hit the ground"]
weight = 1.0
rationale = "filler that claims readiness without naming a single thing the writer can do"

[[rules]]
id = "P046"
name = "spearhead"
kind = "phrase"
patterns = ["spearheaded", "spearheading", "spearhead"]
replace = "led"
weight = 0.8
rationale = "spearheaded is inflation for led"

[[rules]]
id = "P047"
name = "wide-range-of"
kind = "phrase"
patterns = ["a wide range of", "a broad range of", "a diverse range of"]
weight = 0.6
rationale = "vague quantifier standing in for the actual list"

[[rules]]
id = "T057"
name = "state-of-the-art"
kind = "word"
patterns = ["state-of-the-art", "state of the art"]
weight = 0.3
rationale = "state-of-the-art claims technical superiority without a comparison"

[[rules]]
id = "T058"
name = "transformation"
kind = "phrase"
# T038 already covers transformative.
patterns = ["digital transformation", "digital transformations", "business transformation", "business transformations", "transformational"]
weight = 0.3
rationale = "promotional transformation wording inflates a change without describing it"

[[rules]]
id = "T059"
name = "innovate"
kind = "word"
patterns = ["innovate", "innovates", "innovated", "innovating", "innovation", "innovations", "innovative", "innovatively"]
weight = 0.3
rationale = "innovation language claims novelty without describing the change"

[[rules]]
id = "T060"
name = "paradigm"
kind = "phrase"
patterns = ["paradigm shift", "paradigm shifts", "new paradigm", "new paradigms"]
weight = 0.3
rationale = "paradigm shifts and new paradigms claim a broad change without describing it"

[[rules]]
id = "T061"
name = "bespoke"
kind = "word"
patterns = ["bespoke"]
weight = 0.3
rationale = "bespoke is promotional wording for something made for a specific use"

[[rules]]
id = "T062"
name = "beacon"
kind = "phrase"
patterns = ["beacon of", "beacons of"]
weight = 0.3
rationale = "beacon of frames praise as a guiding light"

[[rules]]
id = "T063"
name = "unparalleled"
kind = "word"
patterns = ["unparalleled"]
weight = 0.3
rationale = "unparalleled claims a comparison the sentence does not supply"

[[rules]]
id = "T064"
name = "supercharge"
kind = "word"
patterns = ["supercharge", "supercharges", "supercharged", "supercharging"]
weight = 0.3
rationale = "supercharge is promotional language for an unspecified improvement"

[[rules]]
id = "T065"
name = "turbocharge"
kind = "word"
patterns = ["turbocharge", "turbocharges", "turbocharged", "turbocharging"]
weight = 0.3
rationale = "turbocharge is promotional language for an unspecified improvement"

[[rules]]
id = "T066"
name = "effortless"
kind = "word"
patterns = ["effortless", "effortlessly"]
weight = 0.3
rationale = "effortless promises ease without saying what work remains"

[[rules]]
id = "T067"
name = "next-level"
kind = "word"
patterns = ["next-level", "next level"]
weight = 0.3
rationale = "next-level asserts an improvement without naming it"

[[rules]]
id = "T068"
name = "compelling"
kind = "word"
patterns = ["compelling", "compellingly"]
weight = 0.3
rationale = "compelling asks the reader to accept praise without its supporting detail"

[[rules]]
id = "T069"
name = "intuitive"
kind = "word"
patterns = ["intuitive", "intuitively"]
weight = 0.3
rationale = "intuitive claims ease of use without describing the interaction"

[[rules]]
id = "T070"
name = "world-class"
kind = "word"
patterns = ["world-class", "world class"]
weight = 0.3
rationale = "world-class claims standing without a comparison"

[[rules]]
id = "T071"
name = "best-in-class"
kind = "word"
patterns = ["best-in-class", "best in class"]
weight = 0.3
rationale = "best-in-class claims standing without naming the class or comparison"

[[rules]]
id = "P048"
name = "whether-you-are"
kind = "regex"
pattern = "(?i)\\bwhether (?:you['\\x{2019}]re|you are) [^.!?\\n]{1,80}?\\bor\\s+\\w+"
weight = 0.4
rationale = "whether you are X or Y is a stock audience framing template"

[[rules]]
id = "P049"
name = "more-than-just"
kind = "regex"
pattern = "(?i)\\bmore than just\\b"
weight = 0.4
rationale = "more than just inflates a description before stating what the thing does"

[[rules]]
id = "P050"
name = "comes-in"
kind = "regex"
pattern = "(?i)\\bthat(?:['\\x{2019}]s| is) where [^.!?\\n]{1,80}?\\bcomes? in\\b"
weight = 0.4
rationale = "that is where X comes in is a stock product introduction"

[[rules]]
id = "P051"
name = "say-goodbye"
kind = "regex"
pattern = "(?i)\\b(?:say|says|said|saying) goodbye to\\b"
weight = 0.4
rationale = "say goodbye to is a stock promise that hides the actual change"

[[rules]]
id = "P052"
name = "imagine-a"
kind = "regex"
pattern = "(?i)\\bimagine an?\\b"
weight = 0.4
rationale = "imagine a is a stock scene-setting prompt, check whether the scene is needed"

[[rules]]
id = "P053"
name = "key-or-truth"
kind = "regex"
pattern = '(?i)\bthe (?:truth is|key is (?:to|that|simple|understanding))\b'
weight = 0.4
rationale = "truth and key framing add authority before stating the claim"

[[rules]]
id = "P054"
name = "helps-you-to"
kind = "regex"
pattern = "(?i)\\bhelp(?:s|ed|ing)? you to\\b"
weight = 0.4
rationale = "helps you to is padded benefit framing, state the action directly"

[[rules]]
id = "P055"
name = "stacked-hedging"
kind = "regex"
pattern = "(?i)\\b(?:could|may|might) (?:potentially|possibly|perhaps)\\b"
weight = 0.4
rationale = "two adjacent hedges repeat the same uncertainty"

[[rules]]
id = "P056"
name = "intensifier-padding"
kind = "regex"
pattern = "(?i)\\b(?:very|really|extremely|absolutely) (?:unique|perfect|essential|unprecedented)\\b"
weight = 0.4
rationale = "an intensifier adds no precision to an absolute claim"

[[rules]]
id = "P057"
name = "heres-the-thing"
kind = "regex"
pattern = "(?i)\\bhere(?:['\\x{2019}]s| is) the thing\\b"
weight = 0.4
rationale = "here is the thing delays the point with conversational filler"

[[rules]]
id = "P058"
name = "ready-to-get-started"
kind = "regex"
pattern = "(?i)\\bready to get started\\b"
weight = 0.4
rationale = "ready to get started is a boilerplate call to action"

[[rules]]
id = "P059"
name = "self-answering-question"
kind = "regex"
pattern = "(?i)\\bthe (?:result|answer|outcome|secret)\\s*\\?"
weight = 0.4
rationale = "a short question announcing its own answer adds dramatic filler"

[[rules]]
id = "P060"
name = "compound-pileup"
kind = "regex"
pattern = "\\b[A-Za-z]+(?:-[A-Za-z]+)+(?:[ \\t,]+(?:[A-Za-z0-9]+[ \\t,]+)*[A-Za-z]+(?:-[A-Za-z]+)+){3}\\b"
weight = 0.4
rationale = "four hyphenated compounds in one sentence can bury the concrete description"

[[rules]]
id = "P061"
name = "crafted"
kind = "phrase"
patterns = ["crafted"]
weight = 0.3
rationale = "crafted can substitute a claim of care for a description of the work"

[[rules]]
id = "P062"
name = "curated"
kind = "phrase"
patterns = ["carefully curated", "expertly curated", "curated experience", "curated experiences", "curated selection", "curated selections"]
weight = 0.3
rationale = "promotional curation wording praises a selection without naming its criteria"

[[rules]]
id = "P063"
name = "navigate-the"
kind = "regex"
pattern = '(?i)\bnavigat(?:e|es|ed|ing) the (?:complexities|landscape|challenges|world|waters|maze|intricacies)\b'
weight = 0.3
rationale = "navigating abstract obstacles frames ordinary decisions as a voyage"

[[rules]]
id = "P064"
name = "in-the-world-of"
kind = "phrase"
patterns = ["in the world of"]
weight = 0.3
rationale = "in the world of is scene-setting filler"

[[rules]]
id = "P065"
name = "lets-dive"
kind = "phrase"
patterns = ["let's dive", "let\u2019s dive", "let us dive"]
weight = 0.3
rationale = "let us dive is a stock transition into the topic"

[[rules]]
id = "P066"
name = "buckle-up"
kind = "phrase"
patterns = ["buckle up"]
weight = 0.3
rationale = "buckle up adds excitement before the writer has given a reason"

[[rules]]
id = "P067"
name = "secret-sauce"
kind = "phrase"
patterns = ["the secret sauce"]
weight = 0.3
rationale = "the secret sauce is a vague metaphor for the actual method"

[[rules]]
id = "P068"
name = "level-up"
kind = "phrase"
patterns = ["level up", "levels up", "leveled up", "levelled up", "leveling up", "levelling up"]
weight = 0.3
rationale = "level up claims progress without stating the improvement"

# PR #14 supplies guarded sentence shapes. All are flag-only.
[[rules]]
id = "S004"
name = "relabel-pairing"
kind = "shape"
shape = "relabel-pairing"
weight = 0.5
rationale = "adjacent short sentences relabel one thing for two audiences instead of explaining the difference"

[[rules]]
id = "S005"
name = "ordinal-drumbeat"
kind = "shape"
shape = "ordinal-drumbeat"
weight = 0.4
rationale = "a count followed by a nounless ordinal turns enumeration into a rhetorical beat"

[[rules]]
id = "S006"
name = "noun-chiasmus"
kind = "shape"
shape = "noun-chiasmus"
weight = 0.5
rationale = "repeating an indefinite head noun around a copula can restate the premise as its conclusion"

[[rules]]
id = "P069"
name = "stock-signoff"
kind = "regex"
pattern = '''(?i)\b(?:let me know if you have (?:any )?(?:other )?questions|hope that helps)\b'''
weight = 0.4
rationale = "stock sign-offs repeat an invitation or reassurance after the answer is complete"

[[rules]]
id = "P070"
name = "happy-to"
kind = "regex"
pattern = '''(?i)\bi(?:['\x{2019}]d| would) be happy to\b'''
weight = 0.4
rationale = "a stock offer of happiness adds ceremony before the action"

[[rules]]
id = "P071"
name = "performed-delight"
kind = "regex"
pattern = '''(?i)\b(?:thanks so much for|really glad you(?:['\x{2019}]re| are)|glad that landed well)\b'''
weight = 0.4
rationale = "stock delight reacts to the reader before answering the message"

[[rules]]
id = "P072"
name = "labelled-honest-note"
kind = "regex"
pattern = '''(?i)\bone honest note(?: on [a-z]+(?:[ -][a-z]+){0,4})?:'''
weight = 0.4
rationale = "labelling a note as honest asks for trust before giving the information"

[[rules]]
id = "P073"
name = "messaging-narration"
kind = "regex"
pattern = '''(?i)\bi (?:just )?wanted to (?:reach out|follow up)\b'''
weight = 0.4
rationale = "narrating the decision to send a message delays its purpose"

[[rules]]
id = "P074"
name = "canned-reassurance"
kind = "regex"
pattern = '''(?i)\b(?:thank you for your patience|rest assured)\b'''
weight = 0.4
rationale = "stock reassurance substitutes a service formula for a concrete update"

[[rules]]
id = "P075"
name = "caveat-preface"
kind = "regex"
pattern = '''(?i)\b(?:just so you know|i should mention)\b'''
weight = 0.4
rationale = "a stock caveat preface delays the fact the reader needs"

[[rules]]
id = "P076"
name = "conditional-suggestion"
kind = "regex"
pattern = '''(?i)\bi would suggest\b'''
weight = 0.4
rationale = "conditional suggestion wording distances the writer from their advice"

[[rules]]
id = "P077"
name = "balanced-reason"
kind = "regex"
pattern = '''(?i)\bnot because [^.!?\r\n|>]{1,100}?\bbut because\b'''
weight = 0.4
rationale = "balanced because clauses stage a contrast before giving the reason"

[[rules]]
id = "P078"
name = "corrective-source-framing"
kind = "regex"
pattern = '''(?i)\bshould be (?:treated|read|understood|seen) as [^.!?\r\n|>]{1,120}?\brather than(?: as)?[ \t]+[a-z]+\b'''
weight = 0.5
rationale = "a prescribed interpretation followed by rather than stages a corrective warning about the source"

[[rules]]
id = "P079"
name = "does-not-establish"
kind = "regex"
pattern = '''(?i)\bdoes not establish (?:that|whether|when|where|who|how|the|any)\b'''
weight = 0.4
rationale = "does not establish is a recurring caution frame, check whether the limitation needs stating"
